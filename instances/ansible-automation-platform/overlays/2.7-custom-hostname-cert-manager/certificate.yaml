apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aap-route
  namespace: ansible-automation-platform
  labels:
    app.kubernetes.io/component: route-certificate
spec:
  # Kustomize replaces these values from the rendered AAP resource.
  secretName: replaced-by-kustomize
  dnsNames:
    - replaced-by-kustomize.example.com
  # issuerRef is supplied by certificate-patch.yaml.
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
