apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aap-route
  namespace: ansible-automation-platform
spec:
  # Replace with an existing, Ready issuer authorized for the customer's domain.
  # A namespaced Issuer must be in ansible-automation-platform.
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: customer-production-issuer
