apiVersion: aap.ansible.com/v1alpha1
kind: AnsibleAutomationPlatform
metadata:
  name: aap
  namespace: ansible-automation-platform
spec:
  # hostname: aap.apps.your-cluster.example.com
  # gateway_tls_enabled: true
  # gateway_tls_secret_name: aap-gateway-tls
  # service_type: ClusterIP
  # ingress_type: route
  # route_tls_termination_mechanism: passthrough
  no_log: true
  controller:
    disabled: false
  eda:
    disabled: false
  hub:
    disabled: false
    storage_type: file
    file_storage_access_mode: ReadWriteMany
    # Omit file_storage_storage_class to use the cluster default.
    # That default must support RWX file storage for Automation Hub.
  lightspeed:
    disabled: true
  mcp:
    disabled: true
